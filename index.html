<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tribuapp - Gestión Familiar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PANTALLA 1: LOGIN / REGISTRO -->
    <div id="auth-view" class="view-container">
        <div class="auth-card">
            <h1>⛺ Tribuapp</h1>
            <p>Gestiona tu hogar de forma inteligente</p>
            
            <form id="auth-form">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="nombre@ejemplo.com" autocomplete="email" required>
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password" minlength="6" required>
                <button type="submit" id="btn-login" class="btn-primary">Iniciar sesión</button>
            </form>
            <p id="auth-error" class="error-text hidden" role="alert"></p>
            <p id="auth-message" class="success-text hidden" role="status"></p>
            <div class="auth-actions">
                <button type="button" id="btn-auth-mode" class="text-button">¿No tienes cuenta? Regístrate</button>
                <button type="button" id="btn-reset-password" class="text-button">He olvidado mi contraseña</button>
            </div>
        </div>
    </div>

    <!-- PANTALLA 2: ONBOARDING (Solo para usuarios nuevos) -->
    <div id="onboarding-view" class="view-container hidden">
        <div class="auth-card">
            <h2>⛺ Crea tu Tribu</h2>
            <p>Configura el perfil de tu hogar para empezar.</p>
            
            <form id="onboarding-form">
                <input type="text" id="tribu-nombre" placeholder="Nombre (ej. Los García)" required>
                
                <select id="tribu-dieta" class="input-select" required>
                    <option value="Mediterránea">Dieta Mediterránea</option>
                    <option value="Vegetariana">Vegetariana</option>
                    <option value="Sin alergias">Libre (De todo)</option>
                </select>

                <select id="tribu-flexibilidad" class="input-select" required>
                    <option value="Flexible">Somos Flexibles</option>
                    <option value="Estricta">Planificación Estricta</option>
                </select>

                <button type="submit" id="btn-onboarding" class="btn-primary">Crear Tribu</button>
            </form>
            <p id="onboarding-error" class="error-text hidden" role="alert"></p>
        </div>
    </div>

    <!-- PANTALLA 3: APP PRINCIPAL -->
    <div id="app-view" class="view-container hidden">
        <!-- Header superior -->
        <header class="app-header">
            <h2 id="view-title">Dashboard</h2>
            <button id="btn-logout" class="btn-icon" title="Cerrar sesión" aria-label="Cerrar sesión">🚪</button>
        </header>

        <!-- Contenedor dinámico donde inyectaremos las vistas -->
        <main id="main-content" class="app-content">
            <!-- El contenido se inyecta desde JavaScript -->
        </main>

        <!-- Barra de navegación inferior (Mobile-First) -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-target="dashboard" aria-current="page">
                <span class="icon">📊</span>
                <span class="label">Resumen</span>
            </button>
            <button class="nav-item" data-target="tareas" aria-current="false">
                <span class="icon">✅</span>
                <span class="label">Tareas</span>
            </button>
            <button class="nav-item" data-target="menus" aria-current="false">
                <span class="icon">🍽️</span>
                <span class="label">Menú</span>
            </button>
            <button class="nav-item" data-target="compra" aria-current="false">
                <span class="icon">🛒</span>
                <span class="label">Compra</span>
            </button>
        </nav>
    </div>

    <!-- Lógica de la aplicación cargada como módulo ES -->
    <script type="module" src="app.js"></script>
</body>
</html>
